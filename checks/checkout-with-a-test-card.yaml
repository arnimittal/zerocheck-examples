version: zerocheck/v1
name: Upgrade to Pro with a test card
description: Provider test mode only. Lists the payment frame origin under allowed_origins in zerocheck.yaml. Proves what the customer saw, not settlement or webhooks.
blocks_merge: true
steps:
  - Navigate to /pricing
  - Click "Upgrade to Pro"
  - Verify text "Test Mode" is visible
  - Enter "4242424242424242" into "Card number"
  - Enter "12 / 34" into "Expiration"
  - Enter "123" into "CVC"
  - Enter "Zerocheck Test" into "Cardholder name"
  - Click "Pay"
  - Verify text "Payment successful" is visible
