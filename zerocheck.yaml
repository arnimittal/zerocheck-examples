# Repository checks are authoritative. Keep test secrets as ${ENV_VAR} references.
project: your-project-id
default_environment: dev
test_directory: zerocheck/tests
environments:
  dev:
    url: http://localhost:3000
  staging:
    url: https://staging.example.com
    # Optional restriction. Omitted or empty, the agent may follow ordinary
    # HTTP(S) navigation and interact with embedded frames. A nonempty list
    # limits interaction to the app origin plus these exact origins, so a
    # restricted environment running the checkout tests would need:
    # allowed_origins:
    #   - https://js.stripe.com
execution:
  retries: 1
